# Builds the image and pushes it to Docker Hub on every push to main and on
# version tags (v0.3 -> :0.3). Also publishes to GitHub's registry (ghcr.io),
# which needs no extra setup.
#
# One-time setup for Docker Hub, in this repo on GitHub:
#   Settings > Secrets and variables > Actions > New repository secret
#     DOCKERHUB_USERNAME   your Docker Hub username
#     DOCKERHUB_TOKEN      a Docker Hub access token with Read & Write
# Without those secrets the Docker Hub push is skipped; ghcr.io still works.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the app starts
        run: |
          python3 -m tzdelay --config /nonexistent.json &
          for i in $(seq 1 15); do curl -sf localhost:8080/api/status && exit 0; sleep 1; done
          exit 1
        env:
          TZDELAY_DATA_DIR: /tmp/tzdelay-data

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.HAS_DOCKERHUB == 'true' && format('docker.io/{0}/tzdelay', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push (Intel/AMD and ARM)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
